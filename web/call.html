<script>
// Lyra state channel (2026-11-18): lyra-web pushes the full page
// state over SSE (GET /status) -- status light, room layers,
// mode -- on the same channel the TV page uses (one display
// service). This page renders state from pushes ONLY (Daniel's
// state-delivery rule); there are no state polling loops left.
window._lyra = { state: null, _sh: [], _jh: [],
  onState(fn) { this._sh.push(fn); if (this.state) { try { fn(this.state); } catch (e) {} } },
  onJob(fn) { this._jh.push(fn); } };
(function () {
  const es = new EventSource('/status');
  window._lyra.es = es;
  es.onmessage = (ev) => {
    let s; try { s = JSON.parse(ev.data); } catch (e) { return; }
    window._lyra.state = s;
    window._lyra._sh.forEach((fn) => { try { fn(s); } catch (e) {} });
  };
  es.addEventListener('job', (ev) => {
    let j; try { j = JSON.parse(ev.data); } catch (e) { return; }
    window._lyra._jh.forEach((fn) => { try { fn(j); } catch (e) {} });
  });
})();
</script>

<script>
// Status light (2026-11-18, Daniel's design): the same component
// as the TV page -- bottom-left dot + label (green idle, pink
// listening, amber thinking, blue speaking, violet dim
// sleeping, red fault with the label naming it), fed only by
// the pushed state channel;
// if the push socket drops, the page itself shows red
// "Disconnected" until the reconnect snapshot replaces it.
(function () {
  const box = document.getElementById('statuslight');
  const lbl = box.querySelector('.lbl');
  function render(state, label) { box.dataset.state = state; lbl.textContent = label || ''; }
  window._lyra.onState((s) => { render(s.state, s.label); });
  window._lyra.es.addEventListener('error', () => { render('error', 'Disconnected'); });
})();
</script>
<script>
(async () => {
  const app = new PIXI.Application({view: document.getElementById('c'), resizeTo: window, backgroundAlpha: 0, antialias: true});
  const model = await PIXI.live2d.Live2DModel.from('models/hiyori_vts/hiyori.model3.json');
  app.stage.addChild(model);
  let natH = 0;
  function fit() {
    if (!natH) natH = model.height;
    const s = (innerHeight / natH) * 1.85;
    model.scale.set(s);
    model.anchor.set(0.5, 0);
    model.x = innerWidth / 2; model.y = innerHeight * 0.03;
  }
  fit(); addEventListener('resize', fit);
  setInterval(() => { model.focus(innerWidth / 2 + (Math.random() - 0.5) * innerWidth * 0.5, innerHeight / 2 + (Math.random() - 0.5) * innerHeight * 0.3); }, 3600);
  const groups = ["haru_g_idle", "haru_g_m01", "haru_g_m02", "haru_g_m03", "haru_g_m04", "haru_g_m05", "haru_g_m06", "haru_g_m07", "haru_g_m08", "haru_g_m09", "haru_g_m10", "haru_g_m11", "haru_g_m12", "haru_g_m13", "haru_g_m14", "haru_g_m15", "haru_g_m16", "haru_g_m17", "haru_g_m18", "haru_g_m19", "haru_g_m20", "haru_g_m21", "haru_g_m22", "haru_g_m23", "haru_g_m24", "haru_g_m25", "haru_g_m26", "m01", "m02", "m03", "m04", "m05", "m06", "m07", "m08", "m09", "m10", "mao_mtn_01", "mao_mtn_02", "mao_mtn_03", "mao_mtn_04", "mao_sample_01", "mao_special_01", "mao_special_02", "mao_special_03", "natori_mtn_00", "natori_mtn_01", "natori_mtn_02", "natori_mtn_03", "natori_mtn_04", "natori_mtn_05", "natori_mtn_06", "natori_mtn_07", "ren_mtn_01", "ren_mtn_02", "ren_mtn_03"];
  const SLEEP_MOTION = "haru_g_m19"; // Her sleep animation: 8 s, eyes closed throughout. NOT in the idle rotation -- reserved for the memory build, where it will represent her sleep cycle.
  const idleGroups = ["m01", "m03", "m05", "m06", "m08", "haru_g_idle", "haru_g_m01", "haru_g_m02", "haru_g_m06", "haru_g_m07", "haru_g_m08", "haru_g_m09", "haru_g_m15", "haru_g_m17", "haru_g_m18", "haru_g_m21", "haru_g_m22", "haru_g_m23", "ren_mtn_01", "ren_mtn_02", "mao_mtn_01", "mao_mtn_02", "mao_mtn_03", "mao_mtn_04", "mao_sample_01", "mao_special_01", "mao_special_02", "mao_special_03", "natori_mtn_00", "natori_mtn_01", "natori_mtn_02", "natori_mtn_03", "natori_mtn_04", "natori_mtn_05", "natori_mtn_06", "natori_mtn_07"]; // happy/neutral faces only (Daniel 2026-11-15): full list stays in groups, sad/frown motions are out of the random rotation
  let speaking = false, lastMotion = -1;
  function motionPlaying() {
    try { const mm = model.internalModel.motionManager;
      if (mm && typeof mm.isFinished === 'function') return !mm.isFinished();
      if (mm && typeof mm.playing === 'boolean') return mm.playing;
    } catch (e) {}
    return false;
  }
  function playRandomMotion() {
    let i; do { i = Math.floor(Math.random() * idleGroups.length); } while (i === lastMotion);
    lastMotion = i;
    try { model.motion(idleGroups[i]); } catch (e) {}
  }
  setInterval(() => { if (!speaking && !motionPlaying()) playRandomMotion(); }, 900);
  // --- speech playback: reply WAV through the analyser, mouth from live RMS ---
  let actx = null, analyser = null, audioEl = null, mouth = 0, rtcTap = false;
  function ensureAudio() {
    if (actx) { actx.resume(); return; }
    actx = new (window.AudioContext || window.webkitAudioContext)();
    audioEl = new Audio();
    const src = actx.createMediaElementSource(audioEl);
    analyser = actx.createAnalyser(); analyser.fftSize = 512;
    const gain = actx.createGain(); gain.gain.value = 1.0;
    src.connect(analyser); analyser.connect(gain); gain.connect(actx.destination);
    audioEl.addEventListener('ended', () => { playingNow = false; playNext(); });
  }
  const buf = new Uint8Array(256);
  app.ticker.add(() => {
    let target = 0;
    if (analyser && ((audioEl && !audioEl.paused) || rtcTap)) {
      analyser.getByteTimeDomainData(buf);
      let sum = 0; for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
      const rms = Math.sqrt(sum / buf.length);
      target = Math.pow(Math.min(1, rms * 7.0), 0.75);
      if (rms > 0.02) target = Math.max(target, 0.18);
    }
    mouth += (target - mouth) * (target > mouth ? 0.85 : 0.28);
    try { model.internalModel.coreModel.setParameterValueById('ParamMouthOpenY', mouth); } catch (e) {}
    try { const cm = model.internalModel.coreModel; cm.setPartOpacityById('PartArmB', 0); cm.setPartOpacityById('PartArmA', 1); } catch (e) {}
    if (!motionPlaying()) {
      try {
        const cm = model.internalModel.coreModel, t = performance.now() / 1000;
        cm.setParameterValueById('ParamBreath', 0.5 + 0.5 * Math.sin(t * 1.7));
        cm.setParameterValueById('ParamBodyAngleX', 2.6 * Math.sin(t * 0.43));
        cm.setParameterValueById('ParamBodyAngleZ', 1.4 * Math.sin(t * 0.31 + 1.7));
        cm.setParameterValueById('ParamAngleZ', 1.8 * Math.sin(t * 0.37 + 0.6));
        if (window._nextBlink === undefined) window._nextBlink = t + 2.4;
        const bt = t - (window._blinkStart || -10);
        let eye = 1;
        if (bt >= 0 && bt < 0.22) eye = Math.abs(bt - 0.11) / 0.11;
        else if (t >= window._nextBlink) { window._blinkStart = t; window._nextBlink = t + 2.4 + Math.random() * 3.2; }
        cm.setParameterValueById('ParamEyeLOpen', eye);
        cm.setParameterValueById('ParamEyeROpen', eye);
      } catch (e) {}
    }
  }, null, PIXI.UPDATE_PRIORITY.LOW);

  // ================= call machinery =================
  const statusEl = document.getElementById('status');
  const hintEl = document.getElementById('hint');
  const btn = document.getElementById('callbtn');
  const capMe = document.getElementById('capme'), capHer = document.getElementById('capher');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    hintEl.textContent = 'This page needs a secure (https) address for the microphone. Use the tailnet https link.';
  }
  let state = 'off';           // off | starting | streaming | listening | recording | sending | speaking
  let inCall = false, callMode = null;   // callMode: 'stream' | 'legacy'
  let stream = null, micSrc = null, proc = null;
  // Streaming transport (2026-11-18): the call as a WebRTC peer of
  // the core's call RTC server -- his words stream live and render
  // as they finalize, her replies stream sentence by sentence,
  // and talking over her barges in. The record/upload/poll flow
  // below remains whole as the fallback when the peer connection
  // cannot be established.
  let pc = null, dc = null, remoteSrc = null, herText = '';
  const PAGE_BUILD = '__PAGE_BUILD__';   // lyra-web stamps the served build here
  function beacon(event, extra) {
    // The server journal is the only place a phone's engage and
    // fallback decisions are visible -- a silent fallback hid a
    // stale page for a whole evening (2026-11-18). Fire and forget.
    try {
      fetch('/call/clientlog', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(Object.assign({event: event, build: PAGE_BUILD, ua: navigator.userAgent}, extra || {}))}).catch(() => {});
    } catch (e) {}
  }
  let preRoll = [], chunks = [], silenceS = 0, speechS = 0, utterS = 0;
  const SR_OUT = 16000;

  function setStatus(t) { statusEl.textContent = t; }
  function downsample(f32, inRate) {
    const ratio = inRate / SR_OUT, outLen = Math.floor(f32.length / ratio);
    const out = new Float32Array(outLen);
    for (let i = 0; i < outLen; i++) out[i] = f32[Math.floor(i * ratio)];
    return out;
  }
  function encodeWav(f32) {
    const n = f32.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    ws(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); ws(8, 'WAVEfmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, SR_OUT, true); v.setUint32(28, SR_OUT * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); ws(36, 'data');
    v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) {
      const s = Math.max(-1, Math.min(1, f32[i]));
      v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    return new Blob([buf], {type: 'audio/wav'});
  }
  function onReplyEnded() {
    if (state !== 'speaking') return;
    setTimeout(() => { if (state === 'speaking') { state = 'listening'; setStatus('Listening…'); } }, 350);
  }
  // --- streamed reply playback (2026-11-15): /call/start returns as
  // soon as the utterance is transcribed; the core then synthesizes
  // the reply sentence by sentence and this page polls /call/poll and
  // plays each sentence as it lands, so she starts talking after
  // about one sentence instead of the whole reply.
  let playQ = [], playingNow = false, streamDone = false, turnReply = '';
  let curCall = null, nextIdx = 0, pollTimer = null, turnGen = 0;
  function b64ToBlobUrl(b64) {
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([bytes], {type: 'audio/wav'}));
  }
  function playNext() {
    if (state === 'off' || playingNow) return;
    if (playQ.length) {
      playingNow = true; speaking = true;
      audioEl.src = playQ.shift();
      audioEl.play().catch(() => { playingNow = false; setTimeout(playNext, 60); });
    } else if (streamDone) {
      speaking = false;
      if (turnReply) capHer.textContent = turnReply;
      onReplyEnded();
    }
  }
  function failTurn() {
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
    playQ = []; playingNow = false; speaking = false;
    setStatus('That turn failed — listening again');
    state = 'listening';
    setTimeout(() => { if (state === 'listening') setStatus('Listening…'); }, 1600);
  }
  async function pollCall(gen) {
    if (gen !== turnGen || state === 'off') return;
    try {
      const r = await fetch('/call/poll?call=' + curCall + '&after=' + nextIdx, {cache: 'no-store'});
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || 'poll failed');
      for (const s64 of j.sentences) playQ.push(b64ToBlobUrl(s64));
      nextIdx = j.next;
      if (j.reply) turnReply = j.reply;
      if (j.error) { failTurn(); return; }
      if (j.done) { streamDone = true; playNext(); return; }
      if (!playingNow && playQ.length) playNext();
    } catch (e) { /* transient -- keep polling */ }
    pollTimer = setTimeout(() => pollCall(gen), 250);
  }
  async function sendUtterance() {
    state = 'sending'; setStatus('Thinking...');
    const all = new Float32Array(chunks.reduce((a, c) => a + c.length, 0));
    let off = 0; for (const c of chunks) { all.set(c, off); off += c.length; }
    chunks = [];
    const wav = encodeWav(downsample(all, actx.sampleRate));
    const gen = ++turnGen;
    try {
      const r = await fetch('/call/start', {method: 'POST', body: wav, headers: {'Content-Type': 'audio/wav'}});
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || 'turn failed');
      if (j.transcript) capMe.textContent = j.transcript;
      capHer.textContent = '';
      curCall = j.call_id; nextIdx = 0; playQ = []; playingNow = false;
      streamDone = false; turnReply = '';
      state = 'speaking'; setStatus('Lyra');
      try { model.motion(idleGroups[Math.floor(Math.random() * idleGroups.length)]); } catch (e) {}
      speaking = true;
      pollCall(gen);
    } catch (e) {
      failTurn();
    }
  }
  function handleAudio(e) {
    if (state !== 'listening' && state !== 'recording') return;
    const d = e.inputBuffer.getChannelData(0);
    let sum = 0; for (let i = 0; i < d.length; i++) sum += d[i] * d[i];
    const rms = Math.sqrt(sum / d.length), dur = d.length / actx.sampleRate;
    if (state === 'listening') {
      preRoll.push(new Float32Array(d));
      while (preRoll.length > 8) preRoll.shift();
      if (rms > 0.045) { speechS += dur; } else { speechS = 0; }
      if (speechS > 0.12) {
        state = 'recording'; setStatus('Listening…');
        chunks = preRoll.slice(); preRoll = [];
        silenceS = 0; utterS = 0;
      }
    } else {
      chunks.push(new Float32Array(d)); utterS += dur;
      if (rms < 0.022) { silenceS += dur; } else { silenceS = 0; }
      if ((silenceS > 1.15 && utterS > 0.35) || utterS > 30) {
        if (utterS > 0.35) { sendUtterance(); }
        else { state = 'listening'; }
      }
    }
  }
  let callHb = null;
  function postCallState(on) {
    try { fetch('/callstate', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({active: on})}); } catch (e) {}
  }
  // --- streaming transport: this page as a WebRTC peer ----------
  function attachRemote(s) {
    try {
      detachRemote();
      remoteSrc = actx.createMediaStreamSource(s);
      remoteSrc.connect(analyser);   // the graph renders her (and drives the mouth)
      rtcTap = true;
    } catch (e) {}
  }
  function detachRemote() {
    try { if (remoteSrc) remoteSrc.disconnect(); } catch (e) {}
    remoteSrc = null; rtcTap = false;
  }
  function teardownStreaming() {
    detachRemote();
    if (dc) { try { dc.close(); } catch (e) {} dc = null; }
    if (pc) { try { pc.close(); } catch (e) {} pc = null; }
  }
  function onDcMessage(j) {
    if (j.type === 'partial') {
      capMe.textContent = j.text;   // his words, as they finalize
    } else if (j.type === 'transcript') {
      capMe.textContent = j.text;
      capHer.textContent = ''; herText = '';
      try { model.motion(idleGroups[Math.floor(Math.random() * idleGroups.length)]); } catch (e) {}
    } else if (j.type === 'reply_sentence') {
      speaking = true; setStatus('Lyra');
      herText = herText ? herText + ' ' + j.text : j.text;
      capHer.textContent = herText;   // her words, as they generate
    } else if (j.type === 'reply_done') {
      if (j.text) { herText = j.text; capHer.textContent = j.text; }
      speaking = false;
      if (state === 'streaming') setStatus('Listening…');
    } else if (j.type === 'barge_in') {
      speaking = false;
      if (state === 'streaming') setStatus('Listening…');
    }
  }
  function tryStreaming() {
    // Resolves true once the peer is connected; false when the
    // streaming transport cannot be established -- the caller then
    // runs the legacy flow on the same mic stream.
    return new Promise((resolve) => {
      let settled = false;
      const done = (ok, reason) => { if (!settled) { settled = true; resolve({ok: !!ok, reason: reason || ''}); } };
      let mypc = null;
      try {
        mypc = new RTCPeerConnection(); pc = mypc;
        stream.getTracks().forEach(t => mypc.addTrack(t, stream));
        dc = mypc.createDataChannel('call');
        dc.onmessage = (ev) => { try { onDcMessage(JSON.parse(ev.data)); } catch (e) {} };
        mypc.ontrack = (ev) => { if (ev.streams && ev.streams[0]) attachRemote(ev.streams[0]); };
        mypc.onconnectionstatechange = () => {
          if (pc !== mypc) return;
          if (mypc.connectionState === 'connected') { done(true); }
          else if (mypc.connectionState === 'failed' || mypc.connectionState === 'closed') {
            const wasLive = (callMode === 'stream');
            teardownStreaming();
            if (wasLive && inCall) { callMode = null; beacon('fallback', {reason: 'mid-call connection ' + mypc.connectionState}); startLegacy(); }
            done(false, 'connection ' + mypc.connectionState);
          }
        };
        (async () => {
          try {
            const offer = await mypc.createOffer();
            await mypc.setLocalDescription(offer);
            await new Promise(res => {
              if (mypc.iceGatheringState === 'complete') return res();
              const to = setTimeout(res, 3000);
              mypc.onicegatheringstatechange = () => { if (mypc.iceGatheringState === 'complete') { clearTimeout(to); res(); } };
            });
            if (pc !== mypc) return;
            const r = await fetch('/call/offer', {method: 'POST', headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({sdp: mypc.localDescription.sdp, type: mypc.localDescription.type})});
            if (!r.ok) throw new Error('offer refused ' + r.status);
            const ans = await r.json();
            if (pc !== mypc) return;
            await mypc.setRemoteDescription(ans);
          } catch (e) {
            if (pc === mypc) teardownStreaming();
            done(false, 'signaling: ' + ((e && e.message) || e));
          }
        })();
        setTimeout(() => { if (!settled) { if (pc === mypc) teardownStreaming(); done(false, 'connect timeout'); } }, 9000);
      } catch (e) { done(false, 'RTCPeerConnection: ' + ((e && e.message) || e)); }
    });
  }
  function startLegacy() {
    // The pre-streaming flow, kept whole as the fallback: browser
    // VAD cuts an utterance, /call/start transcribes it, /call/poll
    // streams the reply sentences back for playback.
    callMode = 'legacy';
    micSrc = actx.createMediaStreamSource(stream);
    proc = actx.createScriptProcessor(4096, 1, 1);
    proc.onaudioprocess = handleAudio;
    const mute = actx.createGain(); mute.gain.value = 0;
    micSrc.connect(proc); proc.connect(mute); mute.connect(actx.destination);
    // prime the reply element inside this tap so iOS lets it play later
    try {
      audioEl.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
      audioEl.play().catch(() => {});
    } catch (e) {}
    state = 'listening'; setStatus('Listening…');
  }
  async function startCall() {
    ensureAudio();
    // Self-heal a stale page (kept-open tab / browser cache): if the
    // build lyra-web would serve now differs from the build this page
    // was served as, reload once so the tap lands on the fresh client
    // instead of silently running an old one.
    try {
      const v = await (await fetch('/call/version', {cache: 'no-store'})).json();
      if (v && v.build && PAGE_BUILD !== '__PAGE_BUILD__' && String(v.build) !== String(PAGE_BUILD)
          && !sessionStorage.getItem('lyra_build_reload')) {
        sessionStorage.setItem('lyra_build_reload', '1');
        beacon('stale_page', {reason: 'served build ' + v.build});
        location.reload();
        return;
      }
    } catch (e) {}
    inCall = true; state = 'starting';
    beacon('engage');
    postCallState(true);
    if (callHb) clearInterval(callHb);
    callHb = setInterval(() => postCallState(true), 10000);
    try {
      stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
    } catch (e) {
      hintEl.textContent = 'Microphone was not allowed. Check the browser prompt, and use the https link.';
      inCall = false; state = 'off'; postCallState(false);
      if (callHb) { clearInterval(callHb); callHb = null; }
      return;
    }
    if (!inCall) { stream.getTracks().forEach(t => t.stop()); stream = null; return; }
    btn.classList.add('on'); btn.innerHTML = '&#128244;';
    hintEl.textContent = 'Just talk — she answers when you pause. Her voice plays here, and on the TV too if it is on.';
    setStatus('Connecting…');
    const res = await tryStreaming();
    if (!inCall) return;
    if (res.ok) {
      callMode = 'stream'; state = 'streaming'; setStatus('Listening…');
      beacon('stream_connected');
    } else {
      beacon('fallback', {reason: res.reason || 'unknown'});
      startLegacy();
    }
  }
  function endCall() {
    inCall = false; callMode = null;
    state = 'off';
    teardownStreaming();
    if (callHb) { clearInterval(callHb); callHb = null; }
    postCallState(false);
    turnGen++;
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
    playQ = []; playingNow = false; streamDone = false;
    if (proc) { proc.onaudioprocess = null; try { proc.disconnect(); } catch (e) {} proc = null; }
    if (micSrc) { try { micSrc.disconnect(); } catch (e) {} micSrc = null; }
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (audioEl) { audioEl.pause(); speaking = false; }
    setStatus('Tap to call');
    btn.classList.remove('on'); btn.innerHTML = '&#128222;';
  }
  btn.addEventListener('click', () => { if (!inCall) startCall(); else endCall(); });
})();
</script>
<script>
// Room window day/night (2026-11-15): the painted room's window
// shows a day sky between sunrise and sunset (Jacksonville, computed
// in-page, the same SunCalc the old scene swap used) and the painted
// night sky otherwise; the layer fades over 1.5 s, re-checked every
// minute.
(function(){

  var LAT=30.3322, LON=-81.6557;
  var rad=Math.PI/180, dayMs=864e5, J1970=2440588, J2000=2451545, e=rad*23.4397;
  function toJulian(d){return d.valueOf()/dayMs-0.5+J1970;}
  function fromJulian(j){return new Date((j+0.5-J1970)*dayMs);}
  function solarMeanAnomaly(d){return rad*(357.5291+0.98560028*d);}
  function eclipticLongitude(M){var C=rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M));var P=rad*102.9372;return M+C+P+Math.PI;}
  function approxTransit(x,lw,n){return 0.0009+(x+lw)/(2*Math.PI)+n;}
  function solarTransitJ(ds,M,L){return J2000+ds+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);}
  function getSunTimes(date){
    var lw=rad*-LON, phi=rad*LAT;
    var d=toJulian(date)-J2000;
    var n=Math.round(d-0.0009-lw/(2*Math.PI));
    var ds=approxTransit(0,lw,n);
    var M=solarMeanAnomaly(ds), L=eclipticLongitude(M);
    var dec=Math.asin(Math.sin(L)*Math.sin(e));
    var Jnoon=solarTransitJ(ds,M,L);
    var cosH=(Math.sin(rad*-0.833)-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec));
    var w=Math.acos(Math.max(-1,Math.min(1,cosH)));
    var Jset=solarTransitJ(approxTransit(w,lw,n),M,L);
    var Jrise=Jnoon-(Jset-Jnoon);
    return {sunrise:fromJulian(Jrise), sunset:fromJulian(Jset)};
  }
  var el = document.getElementById('daywin');
  function desired(){ var n=new Date(), t=getSunTimes(n); return (n>t.sunrise&&n<t.sunset); }
  function apply(){ var d = desired(); window._isNight = !d; if (el) el.style.opacity = d ? '1' : '0'; }
  apply();
  setInterval(apply, 60000);
})();
</script>
<script>
// Room state layers (2026-11-18): the call page shows the SAME
// room as the TV display -- one display service (lyra-web's pushed
// state channel), no call-specific background. Same layer rules as
// index.html; only the sleep canvas-fade is omitted, because
// this page is an active conversation surface.
(function(){
  var off=document.getElementById('roombg-off'),
      slp=document.getElementById('roombg-sleep'), pg=document.getElementById('phonedelta');
  function set(el, on){ if (el) el.style.opacity = on ? '1' : '0'; }
  window._lyra.onState(function(s){
    set(off, !!(s.light && s.light.on === false));
    set(pg, !!s.call_active || (s.mode === 'rtc' && !!s.rtc_connected));
    set(slp, !!s.sleep);
  });
})();
</script>
