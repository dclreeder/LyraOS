<script>
// Lyra state channel (2026-11-18): lyra-web pushes the full page
// state over SSE (GET /status) -- status light, room layers, dim,
// ring, next-alarm, mode -- and speech jobs as events on the same
// socket. This page renders from pushes ONLY (Daniel's
// state-delivery rule); there are no state polling loops left.
// The one fetch that remains is a one-shot /latest.json resync
// when the socket (re)connects, so a job that landed
// mid-reconnect is adopted or queued exactly once (job ids are
// monotonic).
window._lyra = { state: null, _sh: [], _jh: [],
  onState(fn) { this._sh.push(fn); if (this.state) { try { fn(this.state); } catch (e) {} } },
  onJob(fn) { this._jh.push(fn); } };
(function () {
  const es = new EventSource('/status');
  window._lyra.es = es;
  es.onmessage = (ev) => {
    let s; try { s = JSON.parse(ev.data); } catch (e) { return; }
    window._lyra.state = s;
    window._lyra._sh.forEach((fn) => { try { fn(s); } catch (e) {} });
  };
  es.addEventListener('job', (ev) => {
    let j; try { j = JSON.parse(ev.data); } catch (e) { return; }
    window._lyra._jh.forEach((fn) => { try { fn(j); } catch (e) {} });
  });
})();
</script>

<script>
(async () => {
  const app = new PIXI.Application({view: document.getElementById('c'), resizeTo: window, backgroundAlpha: 0, antialias: true});
  const model = await PIXI.live2d.Live2DModel.from('models/hiyori_vts/hiyori.model3.json');
  app.stage.addChild(model);
  let natH = 0;
  function fit() {
    if (!natH) natH = model.height;
    const s = (innerHeight / natH) * 1.85;
    model.scale.set(s);
    model.anchor.set(0.5, 0);
    model.x = innerWidth / 2; model.y = innerHeight * 0.03;
  }
  fit(); addEventListener('resize', fit);
  // gentle gaze wander
  setInterval(() => { model.focus(innerWidth / 2 + (Math.random() - 0.5) * innerWidth * 0.5, innerHeight / 2 + (Math.random() - 0.5) * innerHeight * 0.3); }, 3600);
  // occasional idle motion when not speaking
  const groups = ["haru_g_idle", "haru_g_m01", "haru_g_m02", "haru_g_m03", "haru_g_m04", "haru_g_m05", "haru_g_m06", "haru_g_m07", "haru_g_m08", "haru_g_m09", "haru_g_m10", "haru_g_m11", "haru_g_m12", "haru_g_m13", "haru_g_m14", "haru_g_m15", "haru_g_m16", "haru_g_m17", "haru_g_m18", "haru_g_m19", "haru_g_m20", "haru_g_m21", "haru_g_m22", "haru_g_m23", "haru_g_m24", "haru_g_m25", "haru_g_m26", "m01", "m02", "m03", "m04", "m05", "m06", "m07", "m08", "m09", "m10", "mao_mtn_01", "mao_mtn_02", "mao_mtn_03", "mao_mtn_04", "mao_sample_01", "mao_special_01", "mao_special_02", "mao_special_03", "natori_mtn_00", "natori_mtn_01", "natori_mtn_02", "natori_mtn_03", "natori_mtn_04", "natori_mtn_05", "natori_mtn_06", "natori_mtn_07", "ren_mtn_01", "ren_mtn_02", "ren_mtn_03"];
  const SLEEP_MOTION = "haru_g_m19"; // Her sleep animation: 8 s, eyes closed throughout. NOT in the idle rotation -- reserved for the memory build, where it will represent her sleep cycle.
  const idleGroups = ["m01", "m03", "m05", "m06", "m08", "haru_g_idle", "haru_g_m01", "haru_g_m02", "haru_g_m06", "haru_g_m07", "haru_g_m08", "haru_g_m09", "haru_g_m15", "haru_g_m17", "haru_g_m18", "haru_g_m21", "haru_g_m22", "haru_g_m23", "ren_mtn_01", "ren_mtn_02", "mao_mtn_01", "mao_mtn_02", "mao_mtn_03", "mao_mtn_04", "mao_sample_01", "mao_special_01", "mao_special_02", "mao_special_03", "natori_mtn_00", "natori_mtn_01", "natori_mtn_02", "natori_mtn_03", "natori_mtn_04", "natori_mtn_05", "natori_mtn_06", "natori_mtn_07"]; // happy/neutral faces only (Daniel 2026-11-15): full list stays in groups, sad/frown motions are out of the random rotation
  let speaking = false, lastMotion = -1;
  function motionPlaying() {
    try { const mm = model.internalModel.motionManager;
      if (mm && typeof mm.isFinished === 'function') return !mm.isFinished();
      if (mm && typeof mm.playing === 'boolean') return mm.playing;
    } catch (e) {}
    return false;
  }
  function playRandomMotion() {
    let i; do { i = Math.floor(Math.random() * idleGroups.length); } while (i === lastMotion);
    lastMotion = i;
    try { model.motion(idleGroups[i]); } catch (e) {}
  }
  // keep her in near-continuous motion: as soon as one finishes, start the next
  setInterval(() => { if (!speaking && !motionPlaying()) playRandomMotion(); }, 900);
  // --- speech: poll for jobs, play audio, drive mouth from live RMS ---
  let actx = null, analyser = null, audioEl = null, lastId = 0, mouth = 0;
  function ensureAudio() {
    if (actx) { actx.resume(); return; }
    actx = new (window.AudioContext || window.webkitAudioContext)();
    audioEl = new Audio();
    const src = actx.createMediaElementSource(audioEl);
    analyser = actx.createAnalyser(); analyser.fftSize = 512;
    src.connect(analyser); window._gain = actx.createGain(); analyser.connect(window._gain); window._gain.connect(actx.destination);
    audioEl.addEventListener('ended', () => { playNextJob(); });
  }
  const jobQ = [];
  let jobPlaying = false;
  function playNextJob() {
    const j = jobQ.shift();
    if (!j) { jobPlaying = false; speaking = false; window._speaking = false; return; }
    jobPlaying = true; speaking = true; window._speaking = true;
    ensureAudio();
    if (window._gain) window._gain.gain.value = j.silent ? 0.5 : 1;
    if (j.silent) { try { model.motion(idleGroups[Math.floor(Math.random() * idleGroups.length)]); } catch (e) {} }
    audioEl.src = j.file + '?v=' + j.id;
    audioEl.play().catch(() => { playNextJob(); });
  }
  const buf = new Uint8Array(256);
  app.ticker.add(() => {
    let target = 0;
    if (analyser && ((audioEl && !audioEl.paused) || window._rtcTap)) {
      analyser.getByteTimeDomainData(buf);
      let sum = 0; for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
      const rms = Math.sqrt(sum / buf.length);
      target = Math.pow(Math.min(1, rms * 7.0), 0.75);
      if (rms > 0.02) target = Math.max(target, 0.18);
    }
    mouth += (target - mouth) * (target > mouth ? 0.85 : 0.28);
    try { model.internalModel.coreModel.setParameterValueById('ParamMouthOpenY', mouth); } catch (e) {}
    try { const cm = model.internalModel.coreModel; cm.setPartOpacityById('PartArmB', 0); cm.setPartOpacityById('PartArmA', 1); } catch (e) {} // no arms in any mode (Daniel 2026-11-18): the standard bust-up is her only presentation
    // life layer: breathing, sway and blinks fill the gaps between motions
    if (!motionPlaying()) {
      try {
        const cm = model.internalModel.coreModel, t = performance.now() / 1000;
        cm.setParameterValueById('ParamBreath', 0.5 + 0.5 * Math.sin(t * 1.7));
        cm.setParameterValueById('ParamBodyAngleX', 2.6 * Math.sin(t * 0.43));
        cm.setParameterValueById('ParamBodyAngleZ', 1.4 * Math.sin(t * 0.31 + 1.7));
        cm.setParameterValueById('ParamAngleZ', 1.8 * Math.sin(t * 0.37 + 0.6));
        if (window._nextBlink === undefined) window._nextBlink = t + 2.4;
        const bt = t - (window._blinkStart || -10);
        let eye = 1;
        if (bt >= 0 && bt < 0.22) eye = Math.abs(bt - 0.11) / 0.11;
        else if (t >= window._nextBlink) { window._blinkStart = t; window._nextBlink = t + 2.4 + Math.random() * 3.2; }
        cm.setParameterValueById('ParamEyeLOpen', eye);
        cm.setParameterValueById('ParamEyeROpen', eye);
      } catch (e) {}
    }
  }, null, PIXI.UPDATE_PRIORITY.LOW);
  // Speech jobs arrive as events on the state channel (lyra-web
  // broadcasts each mirrored job the moment it is written) -- no
  // polling. A job is queued at most once, in id order.
  function takeJob(j) {
    if (!j || !j.id || j.id <= lastId) return;
    lastId = j.id;
    jobQ.push(j);
    jobQ.sort((a, b) => a.id - b.id);
    if (!jobPlaying) playNextJob();
  }
  window._lyra.onJob(takeJob);
  // One-shot resync when the state socket (re)connects: the first
  // connect adopts the current job without playing it (a page
  // load must not replay a stale line); a reconnect queues a job
  // that landed while the socket was down.
  let lyraConnects = 0;
  window._lyra.es.addEventListener('open', async () => {
    lyraConnects++;
    try {
      const r = await fetch('/latest.json', {cache: 'no-store'});
      if (!r.ok) return;
      const j = await r.json();
      if (!j.id) return;
      if (lyraConnects === 1) { lastId = j.id; return; }
      takeJob(j);
    } catch (e) {}
  });
  // --- RTC lip sync (2026-11-18): in rtc mode her voice arrives
  // as a WebRTC stream, not a mirror job -- but the mouth reads
  // this one analyser, so the RTC client below taps the remote
  // stream into the same graph (analyser -> gain -> destination)
  // and mutes its own element. One contract: the mouth follows
  // whatever audio this page renders, on every speech path.
  window._rtcSrc = null;
  window._attachRtcAudio = (stream) => {
    try {
      ensureAudio();
      if (actx.state === 'suspended') actx.resume();
      window._detachRtcAudio();
      const srcNode = actx.createMediaStreamSource(stream);
      srcNode.connect(analyser);
      window._rtcSrc = srcNode;
      window._rtcTap = true;
      if (window._gain) window._gain.gain.value = 1;
    } catch (e) {}
  };
  window._detachRtcAudio = () => {
    try { if (window._rtcSrc) window._rtcSrc.disconnect(); } catch (e) {}
    window._rtcSrc = null;
    window._rtcTap = false;
  };
})();

<script>
// Status light (2026-11-18, Daniel's design): bottom-left, a dot
// plus a label naming her state -- green idle, pink listening
// (soft pulse), amber thinking (soft pulse), blue speaking,
// violet dim sleeping, red (slow
// pulse) for a service fault with the label naming it. Fed only
// by the pushed state channel; if the push socket drops, the
// page itself shows red "Disconnected" until the snapshot that
// arrives on reconnect replaces it.
(function () {
  const box = document.getElementById('statuslight');
  const lbl = box.querySelector('.lbl');
  function render(state, label) { box.dataset.state = state; lbl.textContent = label || ''; }
  window._lyra.onState((s) => { render(s.state, s.label); });
  window._lyra.es.addEventListener('error', () => { render('error', 'Disconnected'); });
})();
</script><script>

</script><script>
// Alarm ring (2026-11-15): the TV is the alarm's sounder now. When the
// core fires, lyra-web flags /ring; this page loops the alarm tone and
// acks while it is actually sounding, so the core knows the ring is
// live (and swaps to the speaker box if the acks never come). The page
// self-caps at 16 min; the core's own hard stop ends a ring at 15.
let ringEl = null, ringOn = false, ringSince = 0, ringAckTimer = null;
function ringAck(){ fetch('/ring/ack', {method: 'POST'}).catch(() => {}); }
function ringStop(){ if (ringEl) ringEl.pause(); ringOn = false; if (ringAckTimer) { clearInterval(ringAckTimer); ringAckTimer = null; } }
// Ring state arrives on the pushed state channel; the tone
// starts/stops on transitions. While it sounds, the page still
// acks every 3 s (the core's live-ring proof) and self-caps at
// 16 min -- that loop runs only during a ring and carries no
// state.
async function ringUpdate(ringing){
  if (ringing && !ringOn) {
    if (!ringEl) { ringEl = new Audio('/assets/alarm-tone.opus'); ringEl.loop = true; }
    try {
      await ringEl.play();
      ringOn = true; ringSince = Date.now(); ringAck();
      ringAckTimer = setInterval(() => {
        if (!ringEl.paused) ringAck();
        if (Date.now() - ringSince > 16 * 60 * 1000) ringStop();
      }, 3000);
    } catch (e) {}
  } else if (!ringing && ringOn) ringStop();
}
window._lyra.onState((s) => { ringUpdate(!!(s.ring && s.ring.ringing)); });
</script><script>
// Room window day/night (2026-11-15): the painted room's window
// shows a day sky between sunrise and sunset (Jacksonville, computed
// in-page, the same SunCalc the old scene swap used) and the painted
// night sky otherwise; the layer fades over 1.5 s, re-checked every
// minute.
(function(){

  var LAT=30.3322, LON=-81.6557;
  var rad=Math.PI/180, dayMs=864e5, J1970=2440588, J2000=2451545, e=rad*23.4397;
  function toJulian(d){return d.valueOf()/dayMs-0.5+J1970;}
  function fromJulian(j){return new Date((j+0.5-J1970)*dayMs);}
  function solarMeanAnomaly(d){return rad*(357.5291+0.98560028*d);}
  function eclipticLongitude(M){var C=rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M));var P=rad*102.9372;return M+C+P+Math.PI;}
  function approxTransit(x,lw,n){return 0.0009+(x+lw)/(2*Math.PI)+n;}
  function solarTransitJ(ds,M,L){return J2000+ds+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);}
  function getSunTimes(date){
    var lw=rad*-LON, phi=rad*LAT;
    var d=toJulian(date)-J2000;
    var n=Math.round(d-0.0009-lw/(2*Math.PI));
    var ds=approxTransit(0,lw,n);
    var M=solarMeanAnomaly(ds), L=eclipticLongitude(M);
    var dec=Math.asin(Math.sin(L)*Math.sin(e));
    var Jnoon=solarTransitJ(ds,M,L);
    var cosH=(Math.sin(rad*-0.833)-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec));
    var w=Math.acos(Math.max(-1,Math.min(1,cosH)));
    var Jset=solarTransitJ(approxTransit(w,lw,n),M,L);
    var Jrise=Jnoon-(Jset-Jnoon);
    return {sunrise:fromJulian(Jrise), sunset:fromJulian(Jset)};
  }
  var el = document.getElementById('daywin');
  function desired(){ var n=new Date(), t=getSunTimes(n); return (n>t.sunrise&&n<t.sunset); }
  function apply(){ var d = desired(); window._isNight = !d; if (el) el.style.opacity = d ? '1' : '0'; }
  apply();
  setInterval(apply, 60000);
})();
</script>
<script>

// one. lyra-web pushes the room state on the
// state channel (the light read is cached server-side): ceiling light off -> the room dims and the pendant
// and lamp lose their warm light; display off -> the painted TV goes
// dark; a live call lights the phone on the dresser. Her voice
// pulses the speaker's glow (window._speaking, set by the job
// player).
(function(){
  var off=document.getElementById('roombg-off'),
      slp=document.getElementById('roombg-sleep'), pg=document.getElementById('phonedelta'),
      cv=document.getElementById('c');
  function set(el, on){ if (el) el.style.opacity = on ? '1' : '0'; }
  window._lyra.onState(function(s){
    set(off, !!(s.light && s.light.on === false));
    set(pg, !!s.call_active || (s.mode === 'rtc' && !!s.rtc_connected));
    set(slp, !!s.sleep);
    if (cv) cv.style.opacity = s.sleep ? '0' : '1';
  });
})();

<script>
// Next alarm under the clock (2026-11-15, Daniel's ask): the
// core's alarm summary rides the pushed state channel and shows
// the next fire -- Today / Tomorrow / weekday + 12-hour time.
(function(){
  const aEl = document.querySelector('#clock .a');
  if (!aEl) return;
  function fmt(j) {
    if (j.ringing) return '🚨 Now';
    if (!j.enabled || !j.next_fire) return '';
    const nf = new Date(j.next_fire), now = new Date();
    const time = nf.toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'});
    const sameDay = nf.toDateString() === now.toDateString();
    const tmr = new Date(now); tmr.setDate(tmr.getDate() + 1);
    const day = sameDay ? 'Today' : (nf.toDateString() === tmr.toDateString() ? 'Tomorrow'
      : nf.toLocaleDateString('en-US', {weekday: 'short'}));
    return '🚨 ' + day + ' ' + time;
  }
  window._lyra.onState((s) => {
    aEl.textContent = s.alarm ? fmt(s.alarm) : '';
    aEl.style.display = aEl.textContent ? '' : 'none';
  });
})();
</script>
<script>
// RTC client (2026-11-16): in rtc mode THIS page is Lyra's WebRTC
// peer -- the same browser, the same page; the mode is a state of
// the one system, not a different surface. The page captures the
// system default microphone (no device is selected or pinned
// anywhere) and plays her returned audio through a plain audio
// element, which PipeWire routes to the default sink like every
// other stream -- if the default changes mid-session, her voice
// follows it. The connection's life is keyed to the MODE only:
// never to page visibility or the display state (the TV is just a
// display; with the panel off this page keeps running and she is
// still heard on whatever speaker is default).
(function(){
  var pc = null, micStream = null, audioEl = null, connecting = false, remoteStream = null;
  function stopRtc(){
    if (window._detachRtcAudio) window._detachRtcAudio();
    remoteStream = null;
    if (pc) { try { pc.close(); } catch (e) {} pc = null; }
    if (micStream) { micStream.getTracks().forEach(function(t){ t.stop(); }); micStream = null; }
    if (audioEl) { audioEl.srcObject = null; }
    connecting = false;
  }
  async function startRtc(){
    if (pc || connecting) return;
    connecting = true;
    try {
      micStream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}});
      pc = new RTCPeerConnection();
      micStream.getTracks().forEach(function(t){ pc.addTrack(t, micStream); });
      pc.ontrack = function(ev){
        remoteStream = ev.streams[0];
        if (!audioEl) { audioEl = new Audio(); audioEl.autoplay = true; }
        audioEl.muted = true;  // the WebAudio graph renders her voice (and drives the mouth); the element is only a sink
        audioEl.srcObject = remoteStream;
        audioEl.play().catch(function(){});
        if (window._attachRtcAudio) window._attachRtcAudio(remoteStream);
      };
      pc.onconnectionstatechange = function(){
        if (pc && (pc.connectionState === 'failed' || pc.connectionState === 'closed')) stopRtc();
        if (pc && pc.connectionState === 'connected' && remoteStream && !window._rtcTap && window._attachRtcAudio) window._attachRtcAudio(remoteStream);
      };
      var offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await new Promise(function(res){
        if (pc.iceGatheringState === 'complete') return res();
        var to = setTimeout(res, 3000);
        pc.onicegatheringstatechange = function(){ if (pc.iceGatheringState === 'complete') { clearTimeout(to); res(); } };
      });
      var r = await fetch('/rtc/offer', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({sdp: pc.localDescription.sdp, type: pc.localDescription.type})});
      if (!r.ok) throw new Error('offer refused ' + r.status);
      var ans = await r.json();
      await pc.setRemoteDescription(ans);
    } catch (e) { stopRtc(); }
    connecting = false;
  }
  // The mode arrives on the pushed state channel: the peer's
  // life is keyed to mode transitions, never to a poll.
  window._lyra.onState(function(s){
    if (s.mode === 'rtc') startRtc(); else if (pc || connecting) stopRtc();
  });
})();
</script>
