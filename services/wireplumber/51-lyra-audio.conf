# Lyra audio routing (2026-11-16, Daniel's model): Lyra follows
# Fedora's DEFAULT sink -- no per-app pinning. Priorities make the
# default sane: the TV's HDMI wins whenever the TV is on, the
# optical (iec958) output is the last resort, and Bluetooth
# headphones (WirePlumber's own default priority) still take over
# when connected.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.pci-0000_04_00.1.hdmi.*" }
    ]
    actions = {
      update-props = {
        priority.session = 1000
      }
    }
  },
  {
    matches = [
      { node.name = "alsa_output.pci-0000_80_1f.3.iec958-stereo" }
    ]
    actions = {
      update-props = {
        priority.session = 300
      }
    }
  }
]
