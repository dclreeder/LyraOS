# Lyra: system-wide echo cancellation (2026-11-18, Daniel's order).
#
# Echo is a system-layer problem, so the fix lives here, not in
# application code: PipeWire's WebRTC echo-cancel module cleans
# the microphone feed before any consumer sees it.
#
# How it works in this setup:
# - monitor.mode = true: the module takes its playback reference
#   from a stream capturing the monitor ports of Fedora's DEFAULT
#   sink. Whatever plays out of the speakers is the reference; no
#   application reroutes anything, and the reference follows the
#   default sink when it changes.
# - The capture stream follows Fedora's DEFAULT source the same
#   way (today: the ReSpeaker array).
# - The module's output is the virtual source
#   "lyra-echo-cancelled-mic". Its priority.session (3000) sits
#   above the ReSpeaker's (2109), so WirePlumber picks it as the
#   default source whenever it is choosing by priority; an
#   explicitly configured default (wpctl set-default) still wins,
#   as it should. Every consumer that follows the default source
#   -- the core's parecord capture, Firefox getUserMedia -- gets
#   the cleaned feed with no app changes.
#
# ROLLBACK (one step): delete this file (and its repo copy in
# services/pipewire/), then:
#   systemctl --user restart pipewire wireplumber
# The default source falls back to the raw device by priority.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      monitor.mode = true
      capture.props = {
        node.name = "lyra-echo-capture"
        node.description = "Lyra echo-cancel capture (follows default source)"
      }
      source.props = {
        node.name = "lyra-echo-cancelled-mic"
        node.description = "Microphone (echo cancelled)"
        priority.session = 3000
      }
      playback.props = {
        node.name = "lyra-echo-reference"
        node.description = "Lyra echo-cancel reference (default sink monitor)"
      }
    }
  }
]
